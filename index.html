<style>

.brandIdentity{display:flex;align-items:center;gap:13px;min-width:0}.brandLogo{width:94px;height:50px;object-fit:contain;object-position:left center;display:block}.brandProduct{display:flex;flex-direction:column;gap:3px;min-width:0}.brandProduct strong{font-size:11px;letter-spacing:.17em;text-transform:uppercase}.brandProduct span{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.08em}.bottomInner{grid-template-columns:repeat(5,1fr)}

/* v0.8.2 — correzione larghezze sezione Menu */
#view-menu,.menuWorkspace,.menuHero,.menuNotice,.menuSearchBar,.menuSection{width:100%;max-width:100%;min-width:0}
.menuWorkspace>*{min-width:0}
.menuHeroTop>div:first-child{min-width:0;flex:1}
.menuHero h2,.menuHero small,.productTitle,.idHint{overflow-wrap:anywhere;word-break:normal}
.menuSearchBar{grid-template-columns:minmax(0,1fr) minmax(140px,160px)}
.menuSearchBar input,.menuSearchBar select{min-width:0;max-width:100%}
.menuSection{display:block}
.menuProduct{grid-template-columns:minmax(0,1fr) max-content;width:100%;min-width:0}
.menuProduct>div:first-child{min-width:0}
.productSub{min-width:0;flex-wrap:wrap}
.productTools{min-width:0;max-width:100%;flex-wrap:wrap;justify-content:flex-end}
.menuTextBtn{width:auto;max-width:100%;white-space:nowrap}
.menuActions{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);width:100%;min-width:0}
.menuActions button{min-width:0;white-space:normal}
@media(max-width:700px){
  .menuProduct{grid-template-columns:minmax(0,1fr);align-items:start}
  .productTools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;justify-content:stretch}
  .menuTextBtn{width:100%;white-space:normal;padding:0 9px}
}
@media(max-width:560px){
  #view-menu{overflow-x:hidden}
  .menuHero{padding:20px}
  .menuHeroTop{align-items:flex-start}
  .menuCount{min-width:58px;flex:0 0 58px}
  .menuSearchBar{grid-template-columns:minmax(0,1fr)}
  .menuActions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .menuSectionHead,.menuProduct{padding-left:15px;padding-right:15px}
}
@media(max-width:380px){
  .menuHeroTop{display:grid;grid-template-columns:minmax(0,1fr) auto}
  .menuActions{grid-template-columns:minmax(0,1fr)}
  .menuActionWide{grid-column:auto}
  .productTools{grid-template-columns:minmax(0,1fr)}
}

/* v0.8.6 — ripristino categorie storiche e ordine personalizzabile */
.dateRow.contextHidden{display:none!important}
.historySearchActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.historyPrompt,.statsZeroState{padding:30px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#111113}
.statsToolbar{max-width:760px;margin-left:auto;margin-right:auto}
.statsToolbar.dateOnly{grid-template-columns:minmax(0,260px) minmax(0,260px);justify-content:center}
.statsToolbar.dateOnly .singleDayBox,.statsToolbar.dateOnly .statsToolbarActions{grid-column:1/-1}
.menuCategoryEmpty{padding:20px 18px;color:#77736d;font-size:12px;text-align:center}

const DEFAULT_CATEGORY_ORDER=['SFIZI','TAPAS','MENU DEGUSTAZIONE','BURGER','CLUB SANDWICH','PIZZE','BAO DEGUSTAZIONE','DOLCI'];
const CATEGORY_ALIASES={'PIATTI':'TAPAS','SANDWICH':'CLUB SANDWICH','BAO':'BAO DEGUSTAZIONE','DESSERT':'DOLCI'};
function normalizeCategoryName(v){const c=String(v||'').trim().toUpperCase();return CATEGORY_ALIASES[c]||c}
function restoreLegacyCategory(v,productId,name){
 const raw=String(v||'').trim().toUpperCase();
 const pid=String(productId||'').toLowerCase();
 const label=String(name||'').trim().toLowerCase();
 if(raw==='PIATTI'){
  if(pid.startsWith('menu-')||label.startsWith('menu '))return 'MENU DEGUSTAZIONE';
  return 'TAPAS';
 }
 return normalizeCategoryName(raw);
}
function getCategoryOrder(){
 const fromDb=Array.isArray(db?.categoryOrder)?db.categoryOrder:[];
 const fromMenu=Array.isArray(db?.menus?.at(-1)?.categories)?db.menus.at(-1).categories:[];
 const all=[...fromDb,...fromMenu,...DEFAULT_CATEGORY_ORDER].map(normalizeCategoryName).filter(Boolean);
 return [...new Set(all)];
}
function orderedCategories(values){
 const unique=[...new Set((values||[]).map(normalizeCategoryName).filter(Boolean))];
 const order=getCategoryOrder();
 return unique.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);if(ia<0&&ib<0)return a.localeCompare(b,'it');if(ia<0)return 1;if(ib<0)return -1;return ia-ib});
}
function orderedMacros(values){
 const base=getCategoryOrder();
 const expanded=[];base.forEach(x=>{expanded.push(x);if(x==='BURGER')expanded.push('UPSELL BURGER')});
 return [...new Set(values)].sort((a,b)=>{const ia=expanded.indexOf(a),ib=expanded.indexOf(b);if(ia<0&&ib<0)return a.localeCompare(b,'it');if(ia<0)return 1;if(ib<0)return -1;return ia-ib});
}

function migrateData085(data){
 if(data.dataRevision!=='0.8.4'&&data.dataRevision!=='0.8.5'&&data.dataRevision!=='0.8.6'){
  const corrected=SEED.historic.filter(x=>x.date.startsWith('2026-01-')||x.date.startsWith('2026-03-'));
  data.historic=(data.historic||[]).filter(x=>!x.date.startsWith('2026-01-')&&!x.date.startsWith('2026-03-')).concat(structuredClone(corrected));
 }
 data.historic=(data.historic||[]).map(x=>({...x,category:restoreLegacyCategory(x.category,x.productId,x.name)}));
 data.historic.sort((a,b)=>a.date.localeCompare(b.date)||a.productId.localeCompare(b.productId));
 (data.menus||[]).forEach(m=>{
  m.items=(m.items||[]).map(i=>({...i,category:restoreLegacyCategory(i.category,i.productId,i.name)}));
  const restoredCats=(m.categories||[]).flatMap(c=>{
   const raw=String(c||'').trim().toUpperCase();
   return raw==='PIATTI'?['TAPAS','MENU DEGUSTAZIONE']:[normalizeCategoryName(raw)];
  });
  const cats=[...restoredCats,...m.items.map(i=>i.category),...DEFAULT_CATEGORY_ORDER];
  const currentRaw=Array.isArray(data.categoryOrder)&&data.categoryOrder.length?data.categoryOrder:DEFAULT_CATEGORY_ORDER;
  const current=currentRaw.flatMap(c=>{
   const raw=String(c||'').trim().toUpperCase();
   return raw==='PIATTI'?['TAPAS','MENU DEGUSTAZIONE']:[normalizeCategoryName(raw)];
  });
  const effectiveOrder=[...new Set([...current,...DEFAULT_CATEGORY_ORDER])];
  m.categories=[...new Set(cats)].sort((a,b)=>{const ia=effectiveOrder.indexOf(a),ib=effectiveOrder.indexOf(b);if(ia<0&&ib<0)return a.localeCompare(b,'it');if(ia<0)return 1;if(ib<0)return -1;return ia-ib});
 });
 if(!Array.isArray(data.categoryOrder)||!data.categoryOrder.length)data.categoryOrder=[...DEFAULT_CATEGORY_ORDER];
 else{
  const restoredOrder=data.categoryOrder.flatMap(c=>{
   const raw=String(c||'').trim().toUpperCase();
   return raw==='PIATTI'?['TAPAS','MENU DEGUSTAZIONE']:[normalizeCategoryName(raw)];
  });
  data.categoryOrder=[...new Set([...restoredOrder,...DEFAULT_CATEGORY_ORDER])];
 }
 data.dataRevision='0.9.3';data.version='0.9.3';
 try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}

function bindEntrySteppers(){
 const view=document.getElementById('view-entry');
 if(!view)return;
 view.querySelectorAll('.stepper').forEach(stepper=>{
  const pid=stepper.dataset.pid;

  const plus=stepper.querySelector('[data-action="plus"]');
  const apply=value=>{
   draft[pid]=Math.max(0,Number.parseInt(value,10)||0);
   input.value=draft[pid];
   updateDraftKpis();
  };
  minus?.addEventListener('click',event=>{event.preventDefault();apply((draft[pid]||0)-1)});
  plus?.addEventListener('click',event=>{event.preventDefault();apply((draft[pid]||0)+1)});
  input?.addEventListener('input',()=>apply(input.value));
  input?.addEventListener('change',()=>apply(input.value));
 });
}

function donutHTML(rows,total,formatter,label){
 const palette=['#d8ff3e','#ff6b57','#4fd1c5','#a78bfa','#f6c453','#58a6ff','#ff7eb6','#93c46b'];
 const clean=rows.filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
 if(!clean.length)return `<div class="chartEmpty">Nessun dato disponibile</div>`;
 const shown=clean.slice(0,7),rest=clean.slice(7).reduce((s,x)=>s+x.value,0);if(rest)shown.push({name:'ALTRO',value:rest});
 let acc=0;const circles=shown.map((x,i)=>{const pct=x.value/total*100;const dash=`${pct} ${100-pct}`;const off=-acc;acc+=pct;return `<circle cx="50" cy="50" r="38" fill="none" stroke="${palette[i%palette.length]}" stroke-width="13" pathLength="100" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/>`}).join('');
 const legend=shown.map((x,i)=>`<div class="legendRow"><span class="legendDot" style="background:${palette[i%palette.length]}"></span><span class="legendName">${x.name}</span><span class="legendVal">${Math.round(x.value/total*100)}%</span></div>`).join('');
 return `<div class="donutWrap"><svg class="donut" viewBox="0 0 100 100" role="img" aria-label="${label}"><circle cx="50" cy="50" r="38" fill="none" stroke="#29292d" stroke-width="13"/>${circles}<text x="50" y="53" text-anchor="middle" class="donutCenterSmall">TOTALE</text></svg><div class="legend">${legend}</div></div>`;
}
let statsPeriod={from:'',to:''};

function setStatsPeriod(mode){const b=statsBounds(),today=new Date(b.max+'T12:00:00');let from=b.min,to=b.max;if(mode==='30'){const d=new Date(today);d.setDate(d.getDate()-29);from=d.toLocaleDateString('sv-SE')}if(mode==='month')from=b.max.slice(0,7)+'-01';if(mode==='year')from=b.max.slice(0,4)+'-01-01';statsPeriod={from:from<b.min?b.min:from,to};statsConfig.singleDay=false;statsSearchApplied=true;renderStats()}

function shiftDate(s,days){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return d.toLocaleDateString('sv-SE')}
function statMetricValue(x){return statsConfig.metric==='revenue'?x.qty*x.price:x.qty}
function statMetricFormat(v){return statsConfig.metric==='revenue'?euro(v):Math.round(v)+' pz'}
function filteredStatsRows(rows){return rows.filter(x=>(statsConfig.macro==='all'||macroForRow(x)===statsConfig.macro)&&(statsConfig.category==='all'||x.category===statsConfig.category)&&(statsConfig.product==='all'||x.productId===statsConfig.product))}
function aggregateStats(rows){
 const map={};rows.forEach(x=>{let key,label;
  if(statsConfig.group==='category'){key=x.category||'ALTRO';label=key}
  else if(statsConfig.group==='product'){key=x.productId;label=x.name}
  else if(statsConfig.group==='month'){key=x.date.slice(0,7);label=new Date(key+'-01T12:00:00').toLocaleDateString('it-IT',{month:'short',year:'2-digit'})}
  else {key=x.date;label=new Date(key+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
  map[key]??={key,label,value:0};map[key].value+=statMetricValue(x)
 });
 const arr=Object.values(map);if(['day','month'].includes(statsConfig.group))return arr.sort((a,b)=>a.key.localeCompare(b.key));return arr.sort((a,b)=>b.value-a.value).slice(0,statsConfig.top||undefined)

function chartSVG(data){
 if(!data.length)return '<div class="chartEmpty">Nessun dato nel periodo selezionato</div>';
 if(statsConfig.chart==='donut')return donutHTML(data.map(x=>({name:x.label.toUpperCase(),value:x.value})),data.reduce((s,x)=>s+x.value,0),statMetricFormat,'Composizione');
 const W=720,H=270,pad={l:38,r:16,t:25,b:54};const max=Math.max(...data.map(x=>x.value),1);
 if(statsConfig.chart==='line'){
  const pts=data.map((x,i)=>{const px=pad.l+(data.length===1?0:(W-pad.l-pad.r)*i/(data.length-1));const py=pad.t+(H-pad.t-pad.b)*(1-x.value/max);return {...x,px,py}});
  const poly=pts.map(p=>p.px+','+p.py).join(' '),area=`${pad.l},${H-pad.b} ${poly} ${pts.at(-1).px},${H-pad.b}`;
  const grid=[0,.25,.5,.75,1].map(v=>{const y=pad.t+(H-pad.t-pad.b)*v;return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" class="chartGridLine"/>`}).join('');
  const labels=pts.map((p,i)=>`<text x="${p.px}" y="${H-25}" text-anchor="middle" class="chartAxisText">${esc(p.label)}</text>${(data.length<=10||i%Math.ceil(data.length/8)===0)?`<circle cx="${p.px}" cy="${p.py}" r="4" class="linePoint"><title>${esc(p.label)}: ${statMetricFormat(p.value)}</title></circle>`:''}`).join('');
  return `<svg class="chartSvg" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="lineFade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d8ff3e" stop-opacity=".32"/><stop offset="1" stop-color="#d8ff3e" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${area}" class="lineArea"/><polyline points="${poly}" class="lineMark"/>${labels}</svg>`
 }
 const gap=10,bw=(W-pad.l-pad.r-gap*(data.length-1))/data.length;
 const bars=data.map((x,i)=>{const h=(H-pad.t-pad.b)*x.value/max,xx=pad.l+i*(bw+gap),yy=H-pad.b-h;return `<rect x="${xx}" y="${yy}" width="${Math.max(4,bw)}" height="${h}" rx="${Math.min(8,bw/2)}" class="barMark"><title>${esc(x.label)}: ${statMetricFormat(x.value)}</title></rect><text x="${xx+bw/2}" y="${H-27}" text-anchor="middle" class="chartAxisText">${esc(x.label.length>12?x.label.slice(0,11)+'…':x.label)}</text>`}).join('');
 const grid=[0,.25,.5,.75,1].map(v=>{const y=pad.t+(H-pad.t-pad.b)*v;return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" class="chartGridLine"/>`}).join('');
 return `<svg class="chartSvg" viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>`
}

function ensureMenuVersion(date,name){

function renderSyncStatus(){
 const dot=document.getElementById('syncDot'),title=document.getElementById('syncTitle'),sub=document.getElementById('syncSubtitle'),btn=document.getElementById('syncBtn'),alignBtn=document.getElementById('alignBtn');if(!dot)return;
 const dirty=(db.syncMeta?.dirtyDates?.length||0)+(db.syncMeta?.menusDirty?1:0);dot.className='syncDot';btn.disabled=false;if(alignBtn)alignBtn.disabled=false;
 if(!syncConfig.url){title.textContent='Solo su questo dispositivo';sub.textContent='Configura Google Sheets per condividere i dati';btn.textContent='Configura';return}
 if(dirty){dot.classList.add('dirty');title.textContent=dirty+' modifiche da sincronizzare';sub.textContent=db.syncMeta?.lastSync?'Ultimo sync '+new Date(db.syncMeta.lastSync).toLocaleString('it-IT'):'Prima sincronizzazione';btn.textContent='Sincronizza';return}
 dot.classList.add('ok');title.textContent='Dati sincronizzati';sub.textContent=db.syncMeta?.lastSync?'Aggiornato '+new Date(db.syncMeta.lastSync).toLocaleString('it-IT'):'Pronto alla sincronizzazione';btn.textContent='Aggiorna';
}
function openSyncSettings(){
 pendingMenuAction=null;const body=`<div class="helpText">Collega l’app al Web App URL di Google Apps Script. La versione 0.9 usa un collegamento compatibile con GitHub Pages e con i browser che bloccano le normali chiamate incrociate.</div><div class="field"><label>URL Web App Apps Script</label><input id="syncUrl" value="${esc(syncConfig.url||'')}" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label>Codice segreto</label><input id="syncToken" type="password" value="${esc(syncConfig.token||'')}" placeholder="Lo stesso inserito nello script"></div><div class="field"><label>Nome dispositivo</label><input id="syncDevice" value="${esc(syncConfig.device||'')}" placeholder="Es. Tablet cucina"></div><div class="syncWarning">La prima sincronizzazione deve essere eseguita dal dispositivo che contiene lo storico completo.</div><div style="height:10px"></div><button class="secondary" onclick="testSyncConnection()">Testa connessione</button><button class="secondary" onclick="downloadRemoteOnly()">Scarica dati dal foglio</button>`;
 modalShell('Sincronizzazione Google Sheets',body,'Salva configurazione','saveSyncSettings()');
}
function saveSyncSettings(){
 const url=document.getElementById('syncUrl').value.trim(),token=document.getElementById('syncToken').value.trim(),device=document.getElementById('syncDevice').value.trim();if(!url||!token||!device){alert('Completa URL, codice e nome dispositivo');return}
 syncConfig={url,token,device};saveSyncConfig();closeModal();renderSyncStatus();

function dayPayload(date){return {date,rows:db.historic.filter(r=>r.date===date),covers:Number(db.covers[date]||0),venueRevenue:Number(db.venueRevenue[date]||0),notes:db.notes[date]||'',updatedAt:Number(db.syncMeta?.dayUpdatedAt?.[date]||Date.now())}}
const SYNC_MESSAGE_TYPE='DONE_KITCHEN_SYNC_V09';
function callSync(payload){
 return new Promise((resolve,reject)=>{
  if(!syncConfig.url)return reject(new Error('URL Apps Script non configurato'));
  const requestId='done_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const iframe=document.createElement('iframe');
  iframe.name='sync_frame_'+requestId;
  iframe.style.display='none';
  iframe.setAttribute('aria-hidden','true');
  const form=document.createElement('form');
  form.method='POST';
  form.action=syncConfig.url;
  form.target=iframe.name;
  form.style.display='none';
  const fullPayload={...payload,token:syncConfig.token,device:syncConfig.device,requestId};
  const fields={transport:'iframe',requestId,payload:JSON.stringify(fullPayload)};
  Object.entries(fields).forEach(([name,value])=>{const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)});
  let settled=false,submitted=false,loads=0;
  const cleanup=()=>{window.removeEventListener('message',onMessage);clearTimeout(timer);clearTimeout(loadFallback);setTimeout(()=>{form.remove();iframe.remove()},250)};
  const finish=(result)=>{if(settled)return;settled=true;cleanup();if(!result?.ok)reject(new Error(result?.error||'Sincronizzazione non riuscita'));else resolve(result)};
  const onMessage=(event)=>{
   const data=event.data;
   if(!data||data.type!==SYNC_MESSAGE_TYPE||data.requestId!==requestId)return;
   finish(data.result||{});
  };
  window.addEventListener('message',onMessage);
  let loadFallback;
  iframe.addEventListener('load',()=>{
   loads++;
   if(!submitted||loads<2||settled)return;
   // Fallback: alcuni browser non consegnano il postMessage di Apps Script,
   // ma il caricamento concluso conferma che il server ha terminato il POST.
   if(payload.action==='sync'||payload.action==='ping'){
    loadFallback=setTimeout(()=>finish({ok:true,appliedDays:payload.days?.length||0,fallback:true}),1200);
   }
  });
  const timer=setTimeout(()=>{if(settled)return;cleanup();reject(new Error('Il server sta impiegando troppo tempo. Non premere di nuovo Sincronizza: controlla prima il foglio e la sezione Esecuzioni di Apps Script.'))},300000);
  document.body.appendChild(iframe);document.body.appendChild(form);
  submitted=true;form.submit();
 });
}
async function testSyncConnection(){
 const url=document.getElementById('syncUrl')?.value.trim()||syncConfig.url;
 const token=document.getElementById('syncToken')?.value.trim()||syncConfig.token;
 const device=document.getElementById('syncDevice')?.value.trim()||syncConfig.device||'Test dispositivo';
 if(!url||!token){alert('Inserisci URL e codice segreto');return}
 const previous={...syncConfig};syncConfig={url,token,device};
 try{const result=await callSync({action:'ping'});alert('Connessione riuscita · server online')}catch(e){alert(e.message)}finally{syncConfig=previous}
}
function mergeRemote(remote){
 if(!remote)return;db.syncMeta=db.syncMeta||{dirtyDates:[],dayUpdatedAt:{}};const dirty=new Set(db.syncMeta.dirtyDates||[]);
 (remote.days||[]).forEach(day=>{const localTs=Number(db.syncMeta.dayUpdatedAt?.[day.date]||0);if(dirty.has(day.date)&&localTs>Number(day.updatedAt||0))return;db.historic=db.historic.filter(r=>r.date!==day.date).concat(day.rows||[]);db.covers[day.date]=Number(day.covers||0);db.venueRevenue[day.date]=Number(day.venueRevenue||0);db.notes[day.date]=day.notes||'';db.syncMeta.dayUpdatedAt[day.date]=Number(day.updatedAt||0)});
 if(remote.menus&&(!db.syncMeta.menusDirty||Number(remote.menusUpdatedAt||0)>=Number(db.syncMeta.menusUpdatedAt||0))){db.menus=remote.menus;db.syncMeta.menusUpdatedAt=Number(remote.menusUpdatedAt||0)}
}
async function synchronize(){
 if(!syncConfig.url){openSyncSettings();return}const btn=document.getElementById('syncBtn');btn.disabled=true;btn.textContent='Sincronizzo…';
 try{
  const dirtyDates=db.syncMeta?.dirtyDates||[];const first=!db.syncMeta?.lastSync;const datesToSend=first&&dirtyDates.length===0?[...new Set(db.historic.map(r=>r.date))]:dirtyDates;
  const result=await callSync({action:'sync',days:datesToSend.map(dayPayload),menus:(first||db.syncMeta?.menusDirty)?db.menus:null,menusUpdatedAt:Number(db.syncMeta?.menusUpdatedAt||Date.now()),clientLastSync:db.syncMeta?.lastSync||0});
  if(result.data)mergeRemote(result.data);db.syncMeta.dirtyDates=[];db.syncMeta.menusDirty=false;db.syncMeta.lastSync=Date.now();persist();const active=document.querySelector('.navBtn.active')?.dataset.view||'entry';switchView(active,document.querySelector('.navBtn.active'));alert(`Sincronizzazione completata${result.appliedDays!=null?' · '+result.appliedDays+' giornate elaborate':''}`);
 }catch(e){document.getElementById('syncDot').className='syncDot error';alert(e.message||'Sincronizzazione non riuscita. I dati locali non sono stati persi.')}finally{btn.disabled=false;renderSyncStatus()}
}
async function alignToDatabase(){
 if(!syncConfig.url){openSyncSettings();return}
 const alignBtn=document.getElementById('alignBtn');
 const syncBtn=document.getElementById('syncBtn');
 const dirty=(db.syncMeta?.dirtyDates?.length||0)+(db.syncMeta?.menusDirty?1:0);
 if(dirty&&!confirm(`Ci sono ${dirty} modifiche locali non ancora sincronizzate.\n\n“Allinea al DB” scarica soltanto i dati dal database e non invia nulla. Le modifiche locali più recenti verranno mantenute, ma è consigliabile sincronizzarle prima.\n\nContinuare?`))return;
 if(alignBtn){alignBtn.disabled=true;alignBtn.textContent='Allineo…'}
 if(syncBtn)syncBtn.disabled=true;
 try{
  const result=await callSync({action:'pull'});
  if(!result.data)throw new Error('Il database non ha restituito dati');
  const beforeDates=new Set(db.historic.map(r=>r.date));
  const remoteDates=new Set((result.data.days||[]).map(d=>d.date));
  mergeRemote(result.data);
  db.syncMeta.lastSync=Date.now();
  db.syncMeta.lastPull=Date.now();
  persist();
  const added=[...remoteDates].filter(d=>!beforeDates.has(d)).length;
  const active=document.querySelector('.navBtn.active')?.dataset.view||'entry';
  switchView(active,document.querySelector('.navBtn.active'));
  alert(`Allineamento completato · ${result.data.days?.length||0} giornate lette dal database${added?` · ${added} nuove`:''}`);
 }catch(e){
  document.getElementById('syncDot').className='syncDot error';
  alert(e.message||'Allineamento al database non riuscito. I dati locali non sono stati persi.');
 }finally{
  if(alignBtn){alignBtn.disabled=false;alignBtn.textContent='Allinea al DB'}
  if(syncBtn)syncBtn.disabled=false;
  renderSyncStatus();
 }
}
async function downloadRemoteOnly(){
 if(!syncConfig.url){alert('Salva prima la configurazione');return}
 closeModal();
 await alignToDatabase();
}


const MONTHS_IT={gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
let askHistory=JSON.parse(localStorage.getItem('done-kitchen-ask-history')||'[]');
function askDateRange(q){
 const dates=db.historic.map(r=>r.date).sort();const min=dates[0]||isoToday(),max=dates.at(-1)||isoToday();
 let from=min,to=max,label='intero storico';const today=new Date(isoToday()+'T12:00:00');
 if(/oggi/.test(q)){from=to=isoToday();label='oggi'}
 else if(/ieri/.test(q)){const x=new Date(today-86400000).toLocaleDateString('sv-SE');from=to=x;label='ieri'}
 else {const n=q.match(/ultim[ie]\s+(\d+)\s+giorn/);if(n){to=max;from=new Date(new Date(to+'T12:00:00')-(Number(n[1])-1)*86400000).toLocaleDateString('sv-SE');label=`ultimi ${n[1]} giorni`}}
 if(/questo mese|mese corrente/.test(q)){const ref=max;from=ref.slice(0,7)+'-01';to=ref;label='mese corrente nei dati'}
 if(/mese scorso|mese precedente/.test(q)){const ref=new Date(max+'T12:00:00');ref.setDate(1);ref.setMonth(ref.getMonth()-1);from=ref.toLocaleDateString('sv-SE');const e=new Date(ref);e.setMonth(e.getMonth()+1);e.setDate(0);to=e.toLocaleDateString('sv-SE');label='mese precedente'}
 for(const [name,num] of Object.entries(MONTHS_IT)){if(q.includes(name)){const y=(q.match(/20\d{2}/)||[max.slice(0,4)])[0];from=`${y}-${String(num).padStart(2,'0')}-01`;const e=new Date(Number(y),num,0);to=e.toLocaleDateString('sv-SE');label=`${name} ${y}`;break}}
 const explicit=q.match(/(20\d{2}-\d{2}-\d{2}).*?(20\d{2}-\d{2}-\d{2})/);if(explicit){from=explicit[1];to=explicit[2];label=`${fmtDate(from)} – ${fmtDate(to)}`}
 return {from,to,label};
}
function askRowsFor(q){const range=askDateRange(q);let rows=db.historic.filter(r=>r.date>=range.from&&r.date<=range.to);const allNames=[...new Map(db.historic.map(r=>[r.productId,{id:r.productId,name:r.name}])).values()].sort((a,b)=>b.name.length-a.name.length);const product=allNames.find(p=>q.includes(p.name.toLowerCase())||q.includes(p.id.toLowerCase().replaceAll('-',' ')));if(product)rows=rows.filter(r=>r.productId===product.id);const cats=[...new Set(db.historic.map(r=>r.category))].sort((a,b)=>b.length-a.length);const category=cats.find(c=>q.includes(c.toLowerCase()));if(category&&!product)rows=rows.filter(r=>r.category===category);return {rows,range,product,category}}
function summarizeRows(rows){const qty=rows.reduce((s,r)=>s+Number(r.qty||0),0),revenue=rows.reduce((s,r)=>s+Number(r.qty||0)*Number(r.price||0),0),days=new Set(rows.map(r=>r.date)).size;const products={};rows.forEach(r=>{const k=r.productId;products[k]??={name:r.name,q:0,r:0};products[k].q+=Number(r.qty||0);products[k].r+=Number(r.qty||0)*Number(r.price||0)});const ranked=Object.values(products).sort((a,b)=>b.q-a.q);return {qty,revenue,days,ranked,avg:qty?revenue/qty:0}}
function answerDataQuestion(question){
 const q=question.trim().toLowerCase();if(!q)return null;const {rows,range,product,category}=askRowsFor(q);const s=summarizeRows(rows);const subject=product?product.name:category?category:'la cucina';
 if(!rows.length)return {text:`Non trovo vendite per <strong>${esc(subject)}</strong> nel periodo <strong>${esc(range.label)}</strong>.`,metrics:[],period:range.label};
 let text='';
 if(/meno vendut|peggior|fanalino|ultim[oa] classifica/.test(q)){const x=[...s.ranked].sort((a,b)=>a.q-b.q)[0];text=`Nel periodo <strong>${esc(range.label)}</strong>, il piatto meno venduto è <strong>${esc(x.name)}</strong> con <strong>${x.q} pezzi</strong> e ${euro(x.r)} di incasso.`}
 else if(/più vendut|piu vendut|miglior|top|train/.test(q)){const x=s.ranked[0];text=`Nel periodo <strong>${esc(range.label)}</strong>, il piatto più venduto è <strong>${esc(x.name)}</strong>: <strong>${x.q} pezzi</strong>, per un incasso di <strong>${euro(x.r)}</strong>. Rappresenta il ${(x.q/s.qty*100).toFixed(1).replace('.',',')}% dei pezzi considerati.`}
 else if(/giorno.*(miglior|più|piu)|quando vendiamo/.test(q)){const days={};rows.forEach(r=>{days[r.date]=(days[r.date]||0)+r.qty*r.price});const [d,v]=Object.entries(days).sort((a,b)=>b[1]-a[1])[0];text=`Il giorno con il maggiore incasso nel periodo <strong>${esc(range.label)}</strong> è stato <strong>${fmtDate(d)}</strong>, con <strong>${euro(v)}</strong> di vendite cucina.`}
 else if(/prezzo medio|scontrino medio|media prezzo/.test(q)){text=`Il prezzo medio ponderato dei prodotti venduti per <strong>${esc(subject)}</strong> nel periodo <strong>${esc(range.label)}</strong> è <strong>${euro(s.avg)}</strong> per pezzo.`}
 else if(/incass|fatturat|ricav/.test(q)){text=`Nel periodo <strong>${esc(range.label)}</strong>, <strong>${esc(subject)}</strong> ha generato un incasso di <strong>${euro(s.revenue)}</strong> attraverso <strong>${s.qty} pezzi</strong> venduti in ${s.days} giornate attive.`}
 else if(/quant|pezzi|unità|unita|vendut/.test(q)){text=`Nel periodo <strong>${esc(range.label)}</strong> risultano venduti <strong>${s.qty} pezzi</strong> di <strong>${esc(subject)}</strong>, per un incasso complessivo di <strong>${euro(s.revenue)}</strong>.`}
 else if(/riassum|sintesi|analizza|andamento|come è andata|come e andata/.test(q)){const top=s.ranked[0];text=`Nel periodo <strong>${esc(range.label)}</strong> la cucina ha venduto <strong>${s.qty} pezzi</strong> per <strong>${euro(s.revenue)}</strong>. Le giornate con vendite sono ${s.days}; la media è ${(s.qty/Math.max(1,s.days)).toFixed(1).replace('.',',')} pezzi al giorno. Il prodotto leader è <strong>${esc(top.name)}</strong> con ${top.q} pezzi.`}
 else {text=`Per <strong>${esc(subject)}</strong>, nel periodo <strong>${esc(range.label)}</strong>, risultano <strong>${s.qty} pezzi</strong> venduti e <strong>${euro(s.revenue)}</strong> di incasso. Il prodotto principale è <strong>${esc(s.ranked[0].name)}</strong>. Prova a chiedere anche “qual è il più venduto?”, “quanto ha incassato?” oppure “qual è il giorno migliore?”.`}
 return {text,period:range.label,metrics:[{v:s.qty,l:'PEZZI'},{v:euro(s.revenue),l:'INCASSO'},{v:s.days,l:'GIORNI ATTIVI'}]};
}
function renderAsk(){const root=document.getElementById('view-ask');root.innerHTML=`<div class="askHero"><span class="aiOfflineBadge">● ASSISTENTE LOCALE · GRATUITO</span><h1>Chiedi ai dati.</h1><p>Scrivi una domanda in linguaggio naturale. L’analisi viene eseguita sul dispositivo, senza inviare i dati a servizi esterni.</p></div><div class="askBox"><textarea id="askInput" placeholder="Es. Qual è stato il piatto più venduto a giugno?"></textarea><div class="askActions"><small>Comprende prodotti, categorie, mesi, quantità, incassi, classifiche e riepiloghi.</small><button class="askButton" onclick="submitAsk()">Analizza →</button></div></div><div class="askSuggestions">${['Qual è il piatto più venduto a giugno?','Quanto hanno incassato i Bao?','Fammi un riassunto dell’ultimo mese','Qual è il giorno migliore?','Qual è il piatto meno venduto?'].map(x=>`<button onclick="useAskSuggestion('${x.replaceAll("'","\\'")}')">${x}</button>`).join('')}</div><div id="askAnswer"></div>${askHistory.length?`<div class="askHistory"><h3>Domande recenti</h3>${askHistory.slice(0,5).map(x=>`<button class="askHistoryItem" onclick="useAskSuggestion('${x.q.replaceAll("'","\\'")}')">${esc(x.q)}<span>${new Date(x.t).toLocaleString('it-IT')}</span></button>`).join('')}</div>`:''}`}
function useAskSuggestion(q){document.getElementById('askInput').value=q;submitAsk()}
function submitAsk(){const input=document.getElementById('askInput'),q=input.value.trim(),a=answerDataQuestion(q);if(!a)return;askHistory=[{q,t:Date.now()},...askHistory.filter(x=>x.q!==q)].slice(0,10);localStorage.setItem('done-kitchen-ask-history',JSON.stringify(askHistory));document.getElementById('askAnswer').innerHTML=`<div class="answerCard"><div class="answerMeta"><span>RISPOSTA DAI DATI</span><small>${esc(a.period)}</small></div><div class="answerText">${a.text}</div><div class="answerMetrics">${a.metrics.map(m=>`<div class="answerMetric"><strong>${m.v}</strong><span>${m.l}</span></div>`).join('')}</div><div class="answerFollowup">I risultati dipendono dai dati salvati su questo dispositivo. Premi <strong>Allinea al DB</strong> prima dell’analisi per scaricare le giornate registrate dagli altri dispositivi.</div></div>`}

function switchView(v,btn){['entry','history','stats','menu','ask'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));document.querySelectorAll('.navBtn').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');document.querySelector('.dateRow')?.classList.toggle('contextHidden',['history','stats','menu'].includes(v));if(v==='entry')renderEntry();if(v==='history')renderHistory();if(v==='stats')renderStats();if(v==='menu')renderMenu();if(v==='ask')renderAsk()}
function goToday(){document.getElementById('workDate').value=isoToday();renderEntry()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='D_ONE_Kitchen_backup_'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();location.reload()}catch(e){alert('Backup non valido')}};r.readAsText(i.files[0])};i.click()}
document.getElementById('workDate').value=isoToday();
document.getElementById('workDate').addEventListener('change',()=>{const active=document.querySelector('.navBtn.active').dataset.view;switchView(active,document.querySelector('.navBtn.active'))});
renderEntry();
renderSyncStatus();
</script>
